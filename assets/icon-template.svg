<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="64" fill="url(#gradient)" />

  <!-- Magnifying glass icon (simplified) -->
  <circle cx="220" cy="220" r="100" stroke="#ffffff" stroke-width="24" fill="none" />
  <line x1="290" y1="290" x2="360" y2="360" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

  <!-- "ALPHA" text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">ALPHA</text>
</svg>
